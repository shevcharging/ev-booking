<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沙田醫院電動車充電服務預約系統</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
    }
    body {
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h2 {
      text-align: center;
      color: #0056b3;
      margin-bottom: 20px;
    }
    .tabs {
      display: flex;
      border-bottom: 2px solid #e0e0e0;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      background: none;
      border: none;
      font-size: 16px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }
    .tab-btn.active {
      color: #0056b3;
      border-bottom: 3px solid #0056b3;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    button.submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #0056b3;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button.submit-btn:hover {
      background-color: #004085;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      font-weight: bold;
      text-align: center;
    }
    .message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .loading {
      text-align: center;
      color: #666;
      font-style: italic;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>沙田醫院電動車充電預約</h2>

  <div class="tabs">
    <button class="tab-btn active" id="tab-book-btn" onclick="switchTab('book')">預約充電</button>
    <button class="tab-btn" id="tab-cancel-btn" onclick="switchTab('cancel')">取消預約</button>
  </div>

  <!-- 預約表單 -->
  <div id="tab-book" class="tab-content active">
    <form id="bookingForm">
      <div class="form-group">
        <label for="date">預約日期：</label>
        <input type="date" id="date" required onchange="loadBookedSlots()">
      </div>

      <div class="form-group">
        <label for="charger">選擇充電位：</label>
        <select id="charger" required onchange="updateTimeSlots()">
          <option value="">-- 請選擇充電位 --</option>
          <option value="25號車位">25號車位</option>
          <option value="26號車位">26號車位</option>
        </select>
      </div>

      <div class="form-group">
        <label for="slot">預約時段：</label>
        <select id="slot" required>
          <option value="">-- 請先選擇車位與日期 --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="name">職員姓名：</label>
        <input type="text" id="name" placeholder="例：張三" required>
      </div>

      <div class="form-group">
        <label for="empId">331 ID / 職員編號：</label>
        <input type="text" id="empId" placeholder="例：123456" required>
      </div>

      <div class="form-group">
        <label for="phone">聯絡電話：</label>
        <input type="tel" id="phone" placeholder="例：91234567" required>
      </div>

      <div class="form-group">
        <label for="email">電郵地址：</label>
        <input type="email" id="email" placeholder="例：example@ha.org.hk" required>
      </div>

      <div class="form-group">
        <label for="carNumber">登記車牌：</label>
        <input type="text" id="carNumber" placeholder="例：AB1234" required>
      </div>

      <button type="submit" class="submit-btn" id="bookSubmitBtn">提交預約</button>
    </form>
  </div>

  <!-- 取消預約表單 -->
  <div id="tab-cancel" class="tab-content">
    <form id="cancelForm">
      <div class="form-group">
        <label for="cancelEmail">登記電郵地址：</label>
        <input type="email" id="cancelEmail" placeholder="請輸入預約時填寫的電郵" required>
      </div>

      <div class="form-group">
        <label for="cancelId">預約編號：</label>
        <input type="text" id="cancelId" placeholder="例如：EV-20260916-1234" required>
      </div>

      <button type="submit" class="submit-btn" id="cancelSubmitBtn" style="background-color: #dc3545;">確認取消預約</button>
    </form>
  </div>

  <div class="loading" id="loadingMsg">資料處理中，請稍候...</div>
  <div class="message" id="responseMsg"></div>
</div>

<script>
  // 已帶入您提供之 Apps Script 部署 URL
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyrLgDXzthXiPb38ZPLPL1uEDj9rh4v7DV4x41I1hKqeK4x13I0a-xk-OuxGDv8bk_v/exec";

  // 時段設定（26號車位時段已更新）
  const TIME_SLOTS = {
    "25號車位": [
      "00:00 – 04:00",
      "04:00 – 08:00",
      "08:00 – 12:00",
      "12:00 – 16:00",
      "16:00 – 20:00",
      "20:00 – 24:00"
    ],
    "26號車位": [
      "00:30 – 04:30",
      "04:30 – 08:30",
      "08:30 – 12:30",
      "12:30 – 16:30",
      "16:30 – 20:30",
      "20:30 – 00:30"
    ]
  };

  let occupiedSlots = {};

  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('date').value = new Date().toISOString().split('T')[0];
    checkUrlParams();
    loadBookedSlots();
  });

  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    document.getElementById(`tab-${tabName}-btn`).classList.add('active');
    document.getElementById(`tab-${tabName}`).classList.add('active');
    hideMessage();
  }

  // 檢查 URL 參數（從電郵點擊取消時自動帶入資料並切換頁籤）
  function checkUrlParams() {
    const urlParams = new URLSearchParams(window.location.search);
    const action = urlParams.get('action');
    const email = urlParams.get('email');
    const bookingId = urlParams.get('id');

    if (action === 'cancel') {
      switchTab('cancel');
      if (email) document.getElementById('cancelEmail').value = decodeURIComponent(email);
      if (bookingId) document.getElementById('cancelId').value = decodeURIComponent(bookingId);
    }
  }

  function loadBookedSlots() {
    showLoading(true);
    fetch(GAS_URL)
      .then(res => res.json())
      .then(data => {
        occupiedSlots = data;
        updateTimeSlots();
        showLoading(false);
      })
      .catch(err => {
        console.error("無法取得預約資料:", err);
        showLoading(false);
      });
  }

  function updateTimeSlots() {
    const date = document.getElementById('date').value;
    const charger = document.getElementById('charger').value;
    const slotSelect = document.getElementById('slot');

    slotSelect.innerHTML = '<option value="">-- 請選擇時段 --</option>';
    if (!date || !charger || !TIME_SLOTS[charger]) return;

    TIME_SLOTS[charger].forEach(slot => {
      const key = `${date}_${charger}_${slot}`;
      const option = document.createElement('option');
      option.value = slot;

      if (occupiedSlots[key]) {
        option.textContent = `${slot} (已被預約)`;
        option.disabled = true;
      } else {
        option.textContent = slot;
      }
      slotSelect.appendChild(option);
    });
  }

  document.getElementById('bookingForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = {
      date: document.getElementById('date').value,
      charger: document.getElementById('charger').value,
      slot: document.getElementById('slot').value,
      name: document.getElementById('name').value.trim(),
      empId: document.getElementById('empId').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      email: document.getElementById('email').value.trim(),
      carNumber: document.getElementById('carNumber').value.trim().toUpperCase()
    };

    if (!formData.slot) {
      showMessage("請選擇有效的預約時段。", "error");
      return;
    }

    showLoading(true);
    setButtonDisabled('bookSubmitBtn', true);

    fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "book", data: formData })
    })
    .then(res => res.json())
    .then(res => {
      showLoading(false);
      setButtonDisabled('bookSubmitBtn', false);
      if (res.success) {
        showMessage(res.message, "success");
        document.getElementById('bookingForm').reset();
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
        loadBookedSlots();
      } else {
        showMessage(res.message, "error");
      }
    })
    .catch(() => {
      showLoading(false);
      setButtonDisabled('bookSubmitBtn', false);
      showMessage("系統連線失敗，請稍後再試。", "error");
    });
  });

  document.getElementById('cancelForm').addEventListener('submit', function(e) {
    e.preventDefault();
    showLoading(true);
    setButtonDisabled('cancelSubmitBtn', true);

    fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "cancel",
        email: document.getElementById('cancelEmail').value.trim(),
        bookingId: document.getElementById('cancelId').value.trim()
      })
    })
    .then(res => res.json())
    .then(res => {
      showLoading(false);
      setButtonDisabled('cancelSubmitBtn', false);
      if (res.success) {
        showMessage(res.message, "success");
        document.getElementById('cancelForm').reset();
        loadBookedSlots();
      } else {
        showMessage(res.message, "error");
      }
    })
    .catch(() => {
      showLoading(false);
      setButtonDisabled('cancelSubmitBtn', false);
      showMessage("系統連線失敗，請稍後再試。", "error");
    });
  });

  function showLoading(show) {
    document.getElementById('loadingMsg').style.display = show ? 'block' : 'none';
  }

  function showMessage(msg, type) {
    const msgBox = document.getElementById('responseMsg');
    msgBox.textContent = msg;
    msgBox.className = `message ${type}`;
    msgBox.style.display = 'block';
  }

  function hideMessage() {
    document.getElementById('responseMsg').style.display = 'none';
  }

  function setButtonDisabled(btnId, disabled) {
    document.getElementById(btnId).disabled = disabled;
  }
</script>

</body>
</html>
